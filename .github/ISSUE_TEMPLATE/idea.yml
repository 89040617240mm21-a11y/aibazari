name: 💡 Idea / Предложение
description: Suggest a feature, a new direction or an improvement
labels: ["idea"]
body:
  - type: textarea
    id: what
    attributes:
      label: What do you propose? · Что предлагаете?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Who will benefit and how? · Кому и чем поможет?
  - type: input
    id: country
    attributes:
      label: Country / city (optional) · Страна / город
