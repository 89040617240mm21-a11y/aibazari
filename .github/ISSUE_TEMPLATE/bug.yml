name: 🐞 Bug / Ошибка
description: Something does not work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect? · Что случилось и что ожидали?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce · Как повторить
